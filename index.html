/* --- Dark study mode: tuned for iPhone Safari --- */
:root{
  color-scheme:dark;
  --ink:#edf2ff;--muted:#a1aec5;--paper:#0a1020;--card:#151e31;--line:#2b3851;
  --navy:#080f1d;--navy2:#192640;--lime:#c8f36a;--lime-ink:#1c2e09;--blue:#9db1ff;
  --blue-soft:#202d49;--mint:#18382c;--mint-ink:#abeec7;--amber:#3a301a;--amber-ink:#f6dc92;
  --red:#421f26;--red-ink:#ffb8b4;--shadow:0 14px 36px rgba(0,0,0,.28);
}
html,body{background:var(--paper);color:var(--ink)}
.app-shell{padding-bottom:20px}
.topbar{background:transparent}
.brand-sub{color:#9aa9c4}
.top-chip{background:#172239;border-color:#2b3851;color:#ecf2ff}
.btn-light{background:#e7edfa;color:#101a2c}
.btn-ghost{background:#1b263c;color:#e8eefc;border-color:#33415b}
.btn-dark{background:#263550;color:#f6f8ff}
.ticket-card{background:linear-gradient(112deg,#1a2944,#151e31);border-color:#2b3b5e}
.ticket-card h3{color:#eff4ff}
.ticket-card p{color:#b5c3dc}
.pill{background:#202d44;color:#dfe8ff}
.pill.gray{background:#202a3e;color:#aebbd1}
.group-block,.stat-card,.formula-card,.mode-card,.quiz-panel,.lesson-section,.flash-card,.settings-card,.simple-row{background:var(--card);border-color:var(--line);color:var(--ink)}
.group-icon.electro{background:#382f1a}.group-icon.current{background:#1d2b48}.group-icon.magnet{background:#19352d}.group-icon.wave{background:#2c2441}
.group-head p,.group-count,.stat-label{color:var(--muted)}
.topic-tile{background:#111a2b;border-color:#2a354b;color:var(--ink)}
.topic-tile.done{background:#173428;border-color:#285b40}
.topic-num{color:#94a3bc}
.toolbar .searchbox input{background:#111a2b;border-color:#2c3952;color:#eff3ff}
.searchbox input::placeholder{color:#8492ab}
.searchbox span{color:#9aa8c0}
.filter-chip{background:#151e31;color:#aab7cd;border-color:#303c54}
.filter-chip.active{background:#c8f36a;color:#1c2e09;border-color:#c8f36a}
.formula-card{background:#131c2e}
.icon-btn{background:#1d2940;border-color:#33415a;color:#c2cde1}
.icon-btn.saved{background:#3a301a;color:#f6dc92;border-color:#6b5725}
.formula-text{background:#0b1323;border-color:#2b3851;color:#f1f5ff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:650}
.formula-note{color:#b0bdd2}
.empty-state{background:#111a2b;border-color:#35425b;color:#adb9ce}
.mode-icon{background:#222e4b}
.mode-card p{color:#aab8cf}
.mode-arrow{color:#94a2bb}
.quiz-meta,.quiz-q span{color:#a7b4ca}
.answer-option{background:#111a2b;border-color:#33415a;color:#edf2ff}
.answer-letter{background:#26334c;color:#cad5e9}
.answer-option.correct{background:#17382c;border-color:#317551;color:#d8f9e6}
.answer-option.correct .answer-letter{background:#285e43;color:#c9f5dc}
.answer-option.wrong{background:#3a2028;border-color:#75404a;color:#ffe2e0}
.answer-option.wrong .answer-letter{background:#5a2b35;color:#ffd2cf}
.feedback.good{background:#17382c;color:#c6f4da}
.feedback.bad{background:#3a2028;color:#ffdcda}
.back-btn{background:#172239;border-color:#34415a;color:#edf2ff}
.lesson-sheet{background:var(--paper)}
.lesson-formula{background:#070e1b;border:1px solid #273751}
.lesson-section p{color:#c1cce0}
.oral-box{background:#1c2942}
.oral-box p{color:#d8e2f6}
.flash-answer{background:#0c1425;color:#f0f4ff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.flash-explain{color:#bac7dc}
.progress-row-head span:last-child{color:#a4b1c8}
.progress-bar{background:#26324a}
.settings-card p{color:#aebbd0}
.footer-note{color:#8190aa}
.simple-row .row-no{background:#222e45;color:#b6c4dc}
.simple-row .row-side{color:#9aa9c0}
.toast{bottom:20px;background:#d6f69a;color:#17250b;box-shadow:0 10px 28px rgba(0,0,0,.35)}

/* Navigation is now a compact top tab strip instead of a fixed bottom panel. */
.bottom-nav{display:none!important}
.main-nav{position:sticky;top:0;z-index:30;max-width:900px;margin:0 auto 7px;padding:7px 16px 10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:rgba(10,16,32,.93);border-bottom:1px solid rgba(58,74,103,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.nav-btn{min-width:0;width:100%;flex-direction:row;gap:5px;padding:10px 5px;border:1px solid transparent;border-radius:13px;background:transparent;color:#9eabc3;font-size:11px;white-space:nowrap}
.nav-icon{font-size:15px;line-height:1}
.nav-btn.active{background:#1b2942;color:#d9f5a0;border-color:#33445e}
.nav-btn.active .nav-icon{filter:none}

/* Draw vector arrows with CSS rather than relying on unsupported combining glyphs. */
.vec{position:relative;display:inline-block;white-space:nowrap;min-width:.68em;text-align:center}
.vec::after{content:"→";position:absolute;left:-.03em;right:-.03em;top:-.62em;text-align:center;font-family:system-ui,-apple-system,sans-serif;font-weight:500;font-size:.72em;line-height:1;color:currentColor;pointer-events:none}
.hat{position:relative;display:inline-block;min-width:.55em;text-align:center}.hat::after{content:"^";position:absolute;left:0;right:0;top:-.58em;text-align:center;font-family:system-ui,-apple-system,sans-serif;font-size:.72em;line-height:1;color:currentColor;pointer-events:none}
.formula-text,.lesson-formula-text,.flash-answer{overflow-wrap:normal;word-break:normal}
@media(min-width:680px){.main-nav{padding-left:26px;padding-right:26px;margin-bottom:9px}.formula-list{grid-template-columns:repeat(2,minmax(0,1fr))}.toast{bottom:20px}}
@media(max-width:375px){.main-nav{padding-left:10px;padding-right:10px;gap:4px}.nav-btn{font-size:10px;padding:9px 3px;gap:4px}.nav-icon{font-size:14px}}

  <noscript>Для работы приложения включите JavaScript в настройках браузера.</noscript>
  <script>
/* Физика Sprint — офлайн-приложение для подготовки к зачёту. */
'use strict';

const TOPICS = [
{ id:1, t:'Закон Кулона', f:'F = (1 / 4π ε₀) · |q₁q₂| / r²', w:'Сила взаимодействия двух неподвижных точечных зарядов пропорциональна произведению модулей зарядов и обратно пропорциональна квадрату расстояния. Одноимённые заряды отталкиваются, разноимённые притягиваются.', say:'В вакууме модуль силы Кулона равен k|q₁q₂|/r², где k = 1/(4π ε₀). Сила направлена вдоль линии, соединяющей заряды.', m:'Не забывай квадрат расстояния r² и различай модуль силы и направление вектора.' },
{ id:2, t:'Напряжённость поля точечного заряда', f:'E⃗ = (1 / 4π ε₀) · (Q / r²) · r̂', w:'Напряжённость — силовая характеристика поля: сила, приходящаяся на единичный положительный пробный заряд. Для точечного источника модуль убывает как 1/r².', say:'E⃗ = F⃗/qпр; поле точечного заряда имеет модуль k|Q|/r². От положительного заряда вектор направлен наружу, к отрицательному — внутрь.', m:'Направление E задают для положительного пробного заряда; единицы — Н/Кл или В/м.' },
{ id:3, t:'Потенциал поля точечного заряда', f:'φ(r) = Q / (4π ε₀ r)', w:'Потенциал — энергетическая характеристика поля, равная потенциальной энергии единичного положительного заряда. Нуль потенциала в этих формулах выбран на бесконечности; знак потенциала совпадает со знаком Q.', say:'Для точечного заряда φ = Q/(4π ε₀r). Потенциал — скаляр, поэтому потенциалы нескольких зарядов складываются алгебраически.', m:'В потенциале расстояние стоит в первой степени, а в напряжённости — во второй.' },
{ id:4, t:'Дипольный момент', f:'p⃗ₑ = q · ℓ⃗', w:'Электрический диполь состоит из зарядов +q и −q, разделённых малым расстоянием ℓ. Вектор ℓ⃗ направлен от отрицательного заряда к положительному, поэтому туда же направлен дипольный момент.', say:'Модуль дипольного момента pₑ = qℓ; направление — от минуса к плюсу. Единица СИ — Кл·м.', m:'Не перепутай направление вектора: от − к +.' },
{ id:5, t:'Напряжённость поля диполя', f:'На оси: E ≈ (1 / 4π ε₀) · 2pₑ / r³', w:'В дальней зоне, когда расстояние до точки намного больше плеча диполя, поле диполя убывает как 1/r³. На оси диполя модуль поля равен 2kpₑ/r³; в произвольном направлении формула имеет угловую зависимость.', say:'На оси диполя E = (1/(4π ε₀))·2pₑ/r³ при r ≫ ℓ. Формула приближённая и применяется в дальней зоне.', m:'Не используй формулу точечного заряда 1/r² для диполя в дальней зоне.' },
{ id:6, t:'Потенциал поля диполя', f:'φ = pₑ cos θ / (4π ε₀ r²)\nНа оси: φ = pₑ / (4π ε₀ r²)', w:'Потенциал диполя зависит от расстояния как 1/r² и от направления на точку через cos θ. На оси диполя перед формулой с модулем pₑ стоит положительный знак со стороны направления дипольного момента и отрицательный — на противоположной стороне.', say:'В дальней зоне φ = kpₑ cosθ/r²; на оси по модулю φ = kpₑ/r². Угол θ отсчитывается между p⃗ и радиус-вектором точки.', m:'Общая формула содержит cos θ; осевая формула — частный случай.' },
{ id:7, t:'Момент сил, действующих на диполь', f:'M⃗ = p⃗ₑ × E⃗\n|M| = pₑ E sin θ', w:'На два заряда диполя в однородном поле действуют противоположные по направлению силы. Их равнодействующая равна нулю, но возникает вращающий момент, стремящийся повернуть диполь вдоль поля.', say:'Момент сил равен векторному произведению дипольного момента на напряжённость. Он максимален при θ = 90° и равен нулю при параллельных векторах.', m:'Угол θ — между p⃗ₑ и E⃗; момент — вектор, а не потенциальная энергия.' },
{ id:8, t:'Потенциальная энергия диполя', f:'Wₚ = −p⃗ₑ · E⃗ = −pₑE cos θ', w:'Энергия зависит от ориентации диполя в поле. Устойчивое положение — дипольный момент направлен вдоль поля (минимум энергии); противоположная ориентация соответствует максимуму.', say:'Wₚ = −pₑE cosθ. При θ = 0 энергия −pE, при θ = 90° ноль, при θ = 180° энергия +pE.', m:'У формулы энергии стоит минус, а у модуля момента сил — sin θ.' },
{ id:9, t:'Поле бесконечной заряженной плоскости', f:'E = σ / (2 ε₀)', w:'Для бесконечной равномерно заряженной непроводящей плоскости поле по обе стороны однородно и перпендикулярно плоскости. Его модуль не зависит от расстояния до плоскости.', say:'По теореме Гаусса E = σ/(2ε₀) с каждой стороны бесконечной заряженной плоскости.', m:'Для проводящей поверхности с зарядом σ внешнее поле у поверхности проводника имеет другой вид: E = σ/ε₀.' },
{ id:10, t:'Потенциал поля бесконечной плоскости', f:'φ(x) − φ(x₀) = −E · (x − x₀)', w:'Поле однородно, поэтому потенциал линейно меняется с координатой вдоль нормали к плоскости. Нельзя выбрать нулевой потенциал на бесконечности, потому что изменение потенциала бесконечно растёт по модулю при уходе вдоль поля.', say:'Из связи E = −dφ/dx следует φ(x)−φ(x₀)=−E(x−x₀) для оси, направленной в сторону E.', m:'У бесконечной плоскости нельзя без пояснений писать φ(∞)=0.' },
{ id:11, t:'Напряжённость поля заряженной нити', f:'E = |τ| / (2π ε₀ r)', w:'У бесконечной равномерно заряженной нити поле радиально и одинаково на цилиндрической поверхности с одной и той же осью. Оно убывает с расстоянием как 1/r.', say:'Для линейной плотности заряда τ поле в вакууме E = |τ|/(2π ε₀r); направление от нити при τ > 0 и к нити при τ < 0.', m:'τ — заряд на единицу длины, измеряется в Кл/м.' },
{ id:12, t:'Потенциал поля заряженной нити', f:'φ(r) − φ(r₀) = −τ/(2π ε₀) · ln(r/r₀)', w:'Поле бесконечной нити радиально, а потенциал получается интегрированием по радиусу. Поскольку логарифм растёт с r, потенциал на бесконечности нельзя принять конечным нулём — нужна опорная точка r₀.', say:'Разность потенциалов φ(r)−φ(r₀)=−τ/(2π ε₀) ln(r/r₀).', m:'Для бесконечной нити задавай опорный потенциал в конечном радиусе r₀.' },
{ id:13, t:'Поле на оси заряженного кольца', f:'Eₓ = (1 / 4π ε₀) · Qx / (R² + x²)³ᐟ²', w:'Поперечные составляющие поля симметричных элементов кольца взаимно компенсируются, остаётся только составляющая вдоль оси. В центре кольца (x = 0) поле равно нулю; при удалении от кольца оно сначала растёт, затем убывает.', say:'На оси кольца Eₓ = kQx/(R²+x²)^(3/2), где x — расстояние от центра вдоль оси.', m:'На оси в центре x = 0 поле равно нулю, хотя потенциал не равен нулю.' },
{ id:14, t:'Потенциал на оси заряженного кольца', f:'φ(x) = (1 / 4π ε₀) · Q / √(R² + x²)', w:'Все элементы кольца находятся на одинаковом расстоянии от точки на оси, поэтому скалярные вклады потенциала складываются особенно просто. В центре φ = kQ/R.', say:'φ(x)=kQ/√(R²+x²). Для точки в центре x=0 получаем φ=kQ/R.', m:'Потенциал складывается скалярно, поэтому не нужно раскладывать его на компоненты.' },
{ id:15, t:'Напряжённость поля проводящей сферы', f:'Внутри: E = 0\nСнаружи: E = Q / (4π ε₀ r²)', w:'В электростатическом равновесии внутри проводника поле равно нулю, а избыточный заряд находится на поверхности. Снаружи сферически симметричное поле такое же, как у точечного заряда Q в центре.', say:'Внутри проводящей сферы E=0; снаружи E=kQ/r². На поверхности берут r=R и рассматривают внешнее значение.', m:'Не путай проводящую сферу с равномерно заряженным сплошным шаром: внутри шара поле обычно не ноль.' },
{ id:16, t:'Потенциал проводящей сферы', f:'Внутри и на поверхности: φ = Q/(4π ε₀R)\nСнаружи: φ = Q/(4π ε₀r)', w:'Внутри проводника E=0, значит потенциал везде одинаков и равен потенциалу поверхности. Снаружи потенциал убывает как 1/r при нуле на бесконечности.', say:'При r ≥ R φ=kQ/r, а внутри проводящей сферы φ=kQ/R — постоянный.', m:'Внутри проводящей сферы в знаменателе стоит радиус сферы R, а не текущий r.' },
{ id:17, t:'Ёмкость проводящей сферы', f:'C = 4π ε₀ R', w:'Электроёмкость — отношение заряда проводника к его потенциалу относительно бесконечности. Для уединённой сферы в вакууме она зависит от радиуса и среды, но не от величины сообщённого заряда.', say:'Так как φ=kQ/R, ёмкость C=Q/φ=4π ε₀R. В среде с относительной проницаемостью εᵣ: C=4π ε₀εᵣR.', m:'Не путай ёмкость сферы C=4πε₀R с формулами ёмкости конденсаторов.' },
{ id:18, t:'Энергия заряженной сферы', f:'W = Q²/(2C) = Q²/(8π ε₀R)', w:'Энергия заряженного проводника — работа, необходимая для накопления заряда. Можно использовать любую равносильную форму W=Q²/(2C)=Cφ²/2=Qφ/2.', say:'Для сферы подставляем C=4πε₀R в W=Q²/(2C).', m:'В энергии есть множитель 1/2.' },
{ id:19, t:'Поле равномерно заряженного шара', f:'Внутри: E = Qr/(4π ε₀R³)\nСнаружи: E = Q/(4π ε₀r²)', w:'Для равномерно заряженного сплошного шара заряд внутри гауссовой сферы радиуса r пропорционален r³. Поэтому внутри E растёт линейно с r, а снаружи шар ведёт себя как точечный заряд.', say:'При r<R: E=kQr/R³; при r≥R: E=kQ/r².', m:'В центре сплошного равномерно заряженного шара E=0, но внутри проводника тоже E=0 — причины разные.' },
{ id:20, t:'Потенциал равномерно заряженного шара', f:'Внутри: φ = Q(3R² − r²)/(8π ε₀R³)\nСнаружи: φ = Q/(4π ε₀r)', w:'Снаружи потенциал совпадает с потенциалом точечного заряда. Внутри он получается интегрированием линейно растущей напряжённости; потенциал непрерывен на поверхности r=R.', say:'Снаружи φ=kQ/r; внутри φ=(kQ/2R)(3−r²/R²).', m:'Внутри сплошного шара потенциал не постоянен, в отличие от проводящей сферы.' },
{ id:21, t:'Ёмкость плоского конденсатора', f:'C = ε₀ εᵣ S / d', w:'При малом зазоре и больших пластинах поле между обкладками можно считать однородным. Ёмкость увеличивается с площадью пластин и диэлектрической проницаемостью и уменьшается при увеличении расстояния между пластинами.', say:'C=ε₀εᵣS/d; в вакууме εᵣ=1.', m:'S — площадь одной обкладки, d — расстояние между ними.' },
{ id:22, t:'Ёмкость сферического конденсатора', f:'C = 4π ε₀ εᵣ · R₁R₂/(R₂ − R₁)', w:'Сферический конденсатор состоит из двух концентрических сфер радиусов R₁ и R₂, где R₂>R₁. Ёмкость задаётся радиусами обеих обкладок и проницаемостью среды между ними.', say:'C=4πε₀εᵣR₁R₂/(R₂−R₁). Для уединённой сферы это выражение переходит в C=4πε₀R при удалении внешней обкладки на бесконечность.', m:'В знаменателе разность радиусов, а не их сумма.' },
{ id:23, t:'Ёмкость цилиндрического конденсатора', f:'C = 2π ε₀ εᵣ l / ln(R₂/R₁)', w:'Коаксиальный цилиндрический конденсатор состоит из двух соосных цилиндров радиусов R₁ и R₂ и длины l. Формула предполагает, что краевыми эффектами у концов можно пренебречь.', say:'C=2πε₀εᵣl/ln(R₂/R₁), где R₂>R₁ и l — длина цилиндров.', m:'В знаменателе натуральный логарифм отношения внешнего радиуса к внутреннему.' },
{ id:24, t:'Параллельное соединение конденсаторов', f:'Cэкв = C₁ + C₂ + … + Cₙ', w:'При параллельном соединении напряжение на всех конденсаторах одинаковое, а общий заряд равен сумме зарядов. Поэтому эквивалентная ёмкость больше любой отдельной ёмкости.', say:'При параллельном соединении Cэкв=ΣCᵢ, а U одинаково на каждом конденсаторе.', m:'Параллельно складываются сами ёмкости; для последовательного соединения складываются обратные величины.' },
{ id:25, t:'Последовательное соединение конденсаторов', f:'1/Cэкв = 1/C₁ + 1/C₂ + … + 1/Cₙ', w:'При последовательном соединении на каждом конденсаторе накапливается одинаковый по модулю заряд, а напряжения складываются. Эквивалентная ёмкость меньше самой маленькой ёмкости в цепочке.', say:'Для двух конденсаторов Cэкв=C₁C₂/(C₁+C₂); в общем случае суммируют 1/Cᵢ.', m:'Для последовательного соединения ёмкость не равна сумме Cᵢ.' },
{ id:26, t:'Связь напряжённости и потенциала', f:'E⃗ = −grad φ', w:'Напряжённость направлена в сторону наиболее быстрого уменьшения потенциала. В одном измерении Eₓ=−dφ/dx; минус показывает, что потенциал убывает вдоль поля.', say:'E⃗=−∇φ; в декартовых координатах Ex=−∂φ/∂x, Ey=−∂φ/∂y, Ez=−∂φ/∂z.', m:'Главный знак в формуле — минус.' },
{ id:27, t:'Интегральная связь поля и потенциала', f:'φB − φA = −∫A→B E⃗ · dl⃗', w:'Разность потенциалов равна минус работе поля на единичный положительный заряд. Для электростатического поля результат не зависит от траектории между точками, потому что поле потенциальное.', say:'φB−φA=−∫E·dl; эквивалентно работа поля A_AB=q(φA−φB).', m:'Следи за порядком индексов: φB−φA соответствует минусу интеграла от A к B.' },
{ id:28, t:'Теорема Гаусса в интегральной форме', f:'∮S E⃗ · dS⃗ = Qвнутр / ε₀', w:'Поток напряжённости через замкнутую поверхность определяется суммарным зарядом внутри неё, а не распределением зарядов снаружи. Теорема особенно удобна при сферической, цилиндрической или плоской симметрии.', say:'Поток E через замкнутую поверхность в вакууме равен охваченному заряду, делённому на ε₀.', m:'Используй именно замкнутую поверхность и алгебраическую сумму зарядов внутри.' },
{ id:29, t:'Вектор поляризации', f:'P⃗ = Σp⃗ᵢ / ΔV\nЛинейный диэлектрик: P⃗ = ε₀χₑE⃗', w:'Поляризация характеризует суммарный дипольный момент единицы объёма диэлектрика. Во внешнем поле электронные оболочки смещаются, а диполи могут ориентироваться вдоль поля.', say:'P⃗ — дипольный момент единицы объёма; в линейном изотропном диэлектрике P⃗=ε₀χₑE⃗.', m:'P — вектор поляризации, не следует путать с плотностью энергии или мощностью.' },
{ id:30, t:'Связь E и электрической индукции D', f:'D⃗ = ε₀E⃗ + P⃗ = ε₀ εᵣ E⃗', w:'Вектор электрического смещения D учитывает поле и поляризацию среды. В линейном однородном изотропном диэлектрике D пропорционален E через ε₀εᵣ.', say:'D⃗=ε₀E⃗+P⃗; если P⃗=ε₀χₑE⃗, то D⃗=ε₀(1+χₑ)E⃗=ε₀εᵣE⃗.', m:'Равенство D=ε₀εᵣE относится к линейному диэлектрику.' },
{ id:31, t:'Закон Ома в интегральной форме', f:'I = U/R, или U = IR', w:'Для однородного участка цепи сила тока равна напряжению на концах, делённому на сопротивление. В лекциях этот закон записан также как I=(φ₁−φ₂)/R.', say:'I=(φ₁−φ₂)/R=U/R. Здесь U — разность потенциалов на участке, R — его сопротивление.', m:'Это интегральный закон для участка цепи; в дифференциальной форме записывается связь плотности тока и E.' },
{ id:32, t:'Закон Ома для участка цепи', f:'I = U/R', w:'При неизменном сопротивлении ток прямо пропорционален напряжению и обратно пропорционален сопротивлению. Формула применима к однородному участку без учёта источников ЭДС внутри этого участка.', say:'Ток на участке I=U/R; напряжение U=IR.', m:'Если есть источник ЭДС внутри рассматриваемого участка, нужна формула для неоднородного участка.' },
{ id:33, t:'Сопротивление проводника', f:'R = ρl / S', w:'Сопротивление однородного проводника растёт с длиной и удельным сопротивлением материала, но уменьшается с площадью поперечного сечения. Температура может менять ρ.', say:'R=ρl/S; ρ — удельное сопротивление, l — длина, S — площадь поперечного сечения.', m:'S — площадь поперечного сечения, не площадь поверхности проводника.' },
{ id:34, t:'Параллельное соединение резисторов', f:'1/Rэкв = 1/R₁ + 1/R₂ + … + 1/Rₙ', w:'На всех параллельных резисторах одинаковое напряжение, а ток делится по ветвям. Добавление параллельной ветви уменьшает общее сопротивление.', say:'Обратное эквивалентное сопротивление равно сумме обратных сопротивлений. Для двух Rэкв=R₁R₂/(R₁+R₂).', m:'При параллельном соединении Rэкв меньше самого маленького резистора.' },
{ id:35, t:'Последовательное соединение резисторов', f:'Rэкв = R₁ + R₂ + … + Rₙ', w:'Через все последовательно соединённые сопротивления течёт одинаковый ток, а напряжения складываются. Эквивалентное сопротивление равно сумме сопротивлений.', say:'Rэкв=ΣRᵢ; ток одинаков во всех элементах цепочки.', m:'Не смешивай последовательное сложение R и параллельное сложение 1/R.' },
{ id:36, t:'Закон Джоуля — Ленца', f:'Q = I²Rt = U²t/R = IUt', w:'При прохождении тока энергия электрического поля превращается в тепло на сопротивлении. Количество теплоты растёт пропорционально времени и квадрату тока при фиксированном R.', say:'Q=I²Rt; используя U=IR, получаем Q=U²t/R=IUt.', m:'Q — энергия/теплота в джоулях; мощность P получается без множителя времени.' },
{ id:37, t:'Мощность электрического тока', f:'P = IU = I²R = U²/R', w:'Мощность показывает, какая энергия выделяется или передаётся за единицу времени. Формулы равносильны для омического участка цепи и преобразуются по закону Ома.', say:'P=A/t=IU; для сопротивления также P=I²R=U²/R.', m:'Не умножай на t — тогда получится энергия, а не мощность.' },
{ id:38, t:'Дифференциальная форма закона Ома', f:'j⃗ = γ E⃗', w:'Локальная форма закона Ома связывает плотность тока в точке с напряжённостью электрического поля в этой точке. γ — удельная электропроводность; для однородного изотропного проводника j и E сонаправлены.', say:'j⃗=γE⃗; эквивалентно E⃗=ρj⃗, где ρ=1/γ.', m:'j — плотность тока, а не сила тока I; γ — проводимость, не сопротивление R.' },
{ id:39, t:'Первое правило Кирхгофа', f:'Σ Iₖ = 0 в узле', w:'Закон сохранения заряда: сколько зарядов за единицу времени приходит в узел, столько же уходит. Токи, направленные к узлу, и от узла записывают с противоположными знаками.', say:'Алгебраическая сумма токов в узле равна нулю; сумма входящих токов равна сумме выходящих.', m:'Заранее выбери и соблюдай соглашение о знаках.' },
{ id:40, t:'Второе правило Кирхгофа', f:'Σ IₖRₖ = Σ εₖ по замкнутому контуру', w:'Закон связан с сохранением энергии: алгебраическая сумма падений напряжения на сопротивлениях равна алгебраической сумме ЭДС при выбранном направлении обхода. Помогает находить неизвестные токи в сложных цепях.', say:'В контуре ΣIR=Σε с согласованными знаками. При обходе через источник знак ЭДС зависит от того, возрастает или падает потенциал.', m:'Выбери направление обхода контура и не меняй правила знаков на ходу.' },
{ id:41, t:'Закон Ома для замкнутой цепи', f:'I = ε / (R + r)', w:'В цепи с источником ЭДС ε учитывают внешнее сопротивление R и внутреннее сопротивление источника r. Чем они больше, тем меньше ток при прочих равных.', say:'I=ε/(R+r), где r — внутреннее сопротивление источника, R — внешнее сопротивление.', m:'Не забудь внутреннее r в знаменателе.' },
{ id:42, t:'Закон Био — Савара — Лапласа', f:'dB⃗ = (μ₀ / 4π) · I (dl⃗ × r̂) / r²', w:'Элемент тока создаёт магнитное поле, величина и направление которого зависят от тока, длины элемента, расстояния и угла. Результирующее поле находят интегрированием и векторным сложением вкладов всех элементов.', say:'Векторно dB=(μ₀/4π) I(dl×r⃗)/r³; модуль dB=(μ₀/4π)I dl sinα/r².', m:'Крестик — векторное произведение; направление задаётся правилом правой руки.' },
{ id:43, t:'Поле бесконечного прямого провода', f:'B = μ₀ I / (2πr)', w:'Линии магнитной индукции вокруг прямого тока — концентрические окружности. Модуль поля пропорционален току и обратно пропорционален расстоянию до провода.', say:'B=μ₀I/(2πr), направление определяют правилом правой руки.', m:'Для длинного прямого проводника знаменатель 2πr.' },
{ id:44, t:'Поле провода конечной длины', f:'B = (μ₀ I / 4πa) · (cos α₁ − cos α₂)', w:'Поле конечного прямого отрезка получают интегрированием закона Био—Савара—Лапласа. Здесь a — кратчайшее расстояние от точки до провода, а углы α₁ и α₂ берутся в геометрическом соглашении лекции для концов отрезка.', say:'B=(μ₀I/(4πa))(cosα₁−cosα₂) в обозначениях лекции; для бесконечного провода предельный результат μ₀I/(2πa).', m:'Уточняй, от какой линии отсчитываются углы: при другой convention формула записывается через sin углов.' },
{ id:45, t:'Поле в центре кругового витка', f:'B = μ₀ I / (2R)\nДля N витков: B = μ₀NI/(2R)', w:'Каждый элемент кругового тока создаёт в центре вклад, перпендикулярный плоскости кольца. Из-за симметрии все вклады направлены одинаково, поэтому суммируются по модулю.', say:'В центре одного витка B=μ₀I/(2R); для N одинаковых витков поле умножается на N.', m:'R — радиус витка; направление поля задаёт правило правой руки.' },
{ id:46, t:'Поле длинного соленоида', f:'B ≈ μ₀ n I, где n = N/l', w:'У достаточно длинного соленоида поле внутри почти однородно, а снаружи значительно слабее и в идеальном приближении равно нулю. n — число витков на единицу длины.', say:'Внутри длинного соленоида B=μ₀nI; в линейной среде с магнитной проницаемостью μᵣ: B=μ₀μᵣnI.', m:'Формула длинного соленоида — приближение при длине, значительно большей диаметра.' },
{ id:47, t:'Поле на оси конечного соленоида', f:'B(z) = (μ₀ n I / 2) · [(z+l/2)/√(R²+(z+l/2)²) − (z−l/2)/√(R²+(z−l/2)²)]', w:'Формула описывает поле на оси конечного соленоида длины l и радиуса R; z отсчитывается от центра, n=N/l. В центре поле симметрично, а при увеличении длины по сравнению с диаметром формула стремится к полю длинного соленоида.', say:'На оси конечного соленоида суммируют вклады всех витков; для центра z=0 формула упрощается, а при l≫2R получается B≈μ₀nI.', m:'Смотри, откуда отсчитывается z. Формула в приложении использует начало координат в центре соленоида.' },
{ id:48, t:'Поле тороида', f:'B(r) = μ₀ N I / (2πr) внутри', w:'Тороид — кольцевая катушка. По теореме о циркуляции внутри идеального тороида поле направлено по окружностям и имеет одинаковый модуль на окружности фиксированного радиуса; снаружи идеального тороида поле равно нулю.', say:'B=μ₀NI/(2πr)=μ₀nI внутри тороида; поле вне идеального тороида принимают равным нулю.', m:'r — расстояние от центра тороида, а не радиус провода.' },
{ id:49, t:'Поток магнитной индукции', f:'Φ = ∫ B⃗ · dS⃗\nОднородное поле: Φ = BS cos θ', w:'Магнитный поток характеризует, насколько магнитное поле пронизывает поверхность. Он максимален при B, параллельном нормали к поверхности, и равен нулю, если поле лежит в плоскости поверхности.', say:'Φ=∫B·dS; если B однородно, Φ=BS cosθ, где θ — угол между B и нормалью к поверхности.', m:'Угол отсчитывается от нормали, а не от самой плоскости.' },
{ id:50, t:'Теорема о циркуляции магнитного поля', f:'∮ B⃗ · dl⃗ = μ₀ Iохв', w:'Циркуляция магнитной индукции по замкнутому контуру в вакууме равна μ₀, умноженной на алгебраическую сумму токов, пронизывающих контур. Это особенно удобно для прямого провода, тороида и соленоида.', say:'∮B·dl=μ₀ΣIₖ; направление обхода и знаки токов согласуют правилом правой руки.', m:'Суммируются только токи, охваченные контуром, с их знаками.' },
{ id:51, t:'Сила Ампера', f:'dF⃗ = I dl⃗ × B⃗\nF = B I l sin θ', w:'Магнитное поле действует на проводник с током. На прямой участок длины l в однородном поле сила зависит от угла между направлением тока и B.', say:'Для прямого участка F=BIl sinθ; направление определяют векторным произведением dl×B.', m:'При токе параллельно B сила равна нулю.' },
{ id:52, t:'Сила взаимодействия параллельных токов', f:'F/l = μ₀ I₁I₂ / (2πd)', w:'Каждый провод с током создаёт магнитное поле, которое действует силой Ампера на второй провод. Токи одинакового направления притягиваются, противоположного — отталкиваются.', say:'На единицу длины F/l=μ₀I₁I₂/(2πd), где d — расстояние между проводами.', m:'Не забудь, что это сила на единицу длины; для длины l умножь на l.' },
{ id:53, t:'Сила Лоренца', f:'F⃗ = q(E⃗ + v⃗ × B⃗)\n|F⃗B| = |q|vB sin θ', w:'Полная сила на движущийся заряд включает электрическую и магнитную части. Магнитная часть перпендикулярна скорости и полю, поэтому сама по себе не меняет модуль скорости, а меняет направление движения.', say:'F=q(E+v×B); если рассматривается только магнитная часть, F_B=|q|vB sinθ.', m:'Для отрицательного заряда направление силы противоположно векторному произведению v×B.' },
{ id:54, t:'Момент сил на рамке с током', f:'M = N I S B sin θ', w:'В однородном магнитном поле противоположные силы Ампера на стороны рамки создают вращающий момент. Магнитный момент рамки pₘ=NIS стремится ориентироваться вдоль B.', say:'Векторно M⃗=p⃗ₘ×B⃗; модуль M=NISB sinθ, где θ — угол между нормалью к рамке и B.', m:'θ — угол между магнитным моментом (нормалью к рамке) и B, не плоскостью рамки.' },
{ id:55, t:'Намагниченность', f:'M⃗ = Σp⃗ₘᵢ / ΔV\nЛинейная среда: M⃗ = χₘ H⃗', w:'Намагниченность — суммарный магнитный момент единицы объёма вещества. В магнитном поле микроскопические магнитные моменты частично ориентируются, создавая макроскопический отклик.', say:'M⃗ равна магнитному моменту единицы объёма; в линейной среде M⃗=χₘH⃗.', m:'Здесь M — намагниченность; момент силы обычно тоже обозначают M, но контекст и векторная запись различают величины.' },
{ id:56, t:'Связь напряжённости и индукции магнитного поля', f:'B⃗ = μ₀(H⃗ + M⃗)\nЛинейная среда: B⃗ = μ₀ μᵣ H⃗', w:'H описывает поле, связанное со свободными токами, а B учитывает также отклик вещества. В линейной изотропной среде B и H пропорциональны.', say:'В веществе B=μ₀(H+M); для линейной среды B=μ₀μᵣH. В вакууме B=μ₀H.', m:'Не пиши B=μ₀H для любого вещества без оговорок.' },
{ id:57, t:'Закон Фарадея', f:'εᵢ = −N dΦ/dt', w:'Изменение магнитного потока через контур вызывает ЭДС индукции. Минус выражает правило Ленца: индуцированный ток противодействует причине, которая его вызвала.', say:'εᵢ=−dΦ/dt для одного витка и −N dΦ/dt для катушки из N витков.', m:'Не потеряй минус и число витков N.' },
{ id:58, t:'Индуктивность соленоида', f:'L = μ₀ μᵣ N² S / l', w:'Индуктивность связывает потокосцепление катушки с током и зависит от геометрии, числа витков и магнитных свойств среды. У длинного соленоида поле внутри близко к однородному.', say:'Для длинного соленоида L=μ₀μᵣN²S/l.', m:'Зависимость от числа витков квадратичная: N².' },
{ id:59, t:'Энергия катушки индуктивности', f:'Wₘ = L I² / 2', w:'Энергия запасается в магнитном поле, создаваемом током катушки. При увеличении тока источник совершает работу против ЭДС самоиндукции.', say:'Wₘ=LI²/2; энергия растёт квадратично с током.', m:'Не путай энергию катушки LI²/2 с мощностью в сопротивлении.' },
{ id:60, t:'Энергия магнитного поля', f:'wₘ = B² / (2 μ₀ μᵣ) = BH/2', w:'Объёмная плотность энергии показывает энергию магнитного поля в единице объёма. Для однородной линейной среды общая энергия получается интегрированием плотности по объёму.', say:'wₘ=B²/(2μ₀μᵣ)=BH/2; в вакууме μᵣ=1. Для катушки Wₘ=LI²/2.', m:'wₘ — плотность энергии (Дж/м³); Wₘ — полная энергия (Дж).' },
{ id:61, t:'Ток при размыкании цепи RL', f:'I(t) = I₀ e^(−t/τ), τ = L/R', w:'После размыкания ток в катушке не исчезает мгновенно: самоиндукция поддерживает его, а запасённая энергия рассеивается на сопротивлении. Ток экспоненциально спадает с постоянной времени τ=L/R.', say:'При размыкании I=I₀e^(−Rt/L), если R — полное сопротивление разряжающего контура.', m:'При t=τ ток падает до I₀/e, то есть примерно до 37% начального.' },
{ id:62, t:'Ток при замыкании цепи RL', f:'I(t) = I∞ [1 − e^(−t/τ)], τ = L/R', w:'После замыкания ток нарастает постепенно, потому что возникающая ЭДС самоиндукции препятствует его быстрому изменению. При длительном времени ток стремится к установившемуся I∞=ε/R.', say:'I(t)=(ε/R)(1−e^(−Rt/L)); постоянная времени τ=L/R.', m:'В момент t=0 ток равен нулю; при t→∞ он стремится к ε/R.' },
{ id:63, t:'Циклическая частота колебательного контура', f:'ω₀ = 1 / √(LC)', w:'В идеальном LC-контуре энергия периодически переходит из электрического поля конденсатора в магнитное поле катушки и обратно. Собственная циклическая частота определяется индуктивностью и ёмкостью.', say:'ω₀=1/√(LC), а период T=2π√(LC).', m:'ω измеряется в рад/с, обычная частота f=ω/(2π) в герцах.' },

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function formulaHtml(value){let html=esc(String(value).replace(/³ᐟ²/g,'^(3/2)').replace(/r̂/g,'r-hat'));html=html.replace(/([\p{L}])⃗/gu,'<span class="vec">$1</span>');return html.replace(/r-hat/g,'<span class="hat">r</span>');}

function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function markStudyDay(){const k=todayKey();if(!progress.studyDays.includes(k))progress.studyDays.push(k);persist();}
function currentStreak(){const set=new Set(progress.studyDays);let d=new Date();let count=0;if(!set.has(todayKey()))d.setDate(d.getDate()-1);while(set.has(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`)){count++;d.setDate(d.getDate()-1);}return count;}
function toast(msg){let old=$('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.remove(),2200);}

function buildQuiz(ids,mode){const qs=ids.map(id=>{const t=topic(id);let candidateIds=shuffle(TOPICS.filter(x=>x.id!==id && x.f!==t.f).filter(x=>mode==='ticket'?x.id%3!==id%3:true).map(x=>x.id));let options=[{id:t.id,f:t.f}];const seen=new Set([t.f]);for(const ci of candidateIds){const c=topic(ci);if(!seen.has(c.f)){options.push({id:c.id,f:c.f});seen.add(c.f);}if(options.length===4)break;}return {id, prompt:mode==='ticket'?TICKET_PROMPTS[id]:`Какая формула относится к теме «${t.t}»?`,options:shuffle(options),answerId:id,answered:false,selected:null};});return {mode,questions:qs,index:0,correct:0,wrong:[],finished:false};}
function beginQuiz(mode){let ids;if(mode==='ticket')ids=TICKET_IDS.slice();else if(mode==='all')ids=shuffle(TOPICS.map(t=>t.id)).slice(0,10);else{const weak=[...new Set([...progress.missed,...progress.saved])].filter(id=>topic(id));if(!weak.length){toast('Пока нет сложных тем — пройди микс из всех тем.');return;}ids=shuffle(weak).slice(0,Math.min(12,weak.length));}state.quiz=buildQuiz(ids,mode);progress.lastMode=mode;persist();state.tab='quiz';render();window.scrollTo(0,0);}
function quizSessionPage(){const qz=state.quiz;if(qz.finished)return quizResultPage();const q=qz.questions[qz.index],t=topic(q.id),selected=q.selected;const pct=fmtPercent(qz.index+(q.answered?1:0),qz.questions.length);return `<main class="page"><div class="section-head" style="margin-top:7px"><div><p class="eyebrow">${qz.mode==='ticket'?'Билет № 1':qz.mode==='all'?'Смешанная тренировка':'Повторение'}</p><h1 class="page-title" style="font-size:26px;margin:0">Думай как на зачёте</h1></div><button class="back-btn" data-action="quit-quiz">Выйти</button></div><div class="progress-bar"><span style="width:${pct}%"></span></div>

e="display:block;color:#aab7cc;font-weight:600;margin-top:3px">${formulaHtml(t.f.split('\n')[0])}</small></span><span class="row-side">›</span></button>`).join('')}</div>`:''}</main>`;}
function cheatPage(){const query=state.search.trim().toLowerCase();let list=TOPICS.filter(t=>(state.filter==='Все'||GROUPS.find(g=>g.name===state.filter&&t.id>=g.from&&t.id<=g.to))&&(!query||`${t.id} ${t.t} ${t.f} ${t.w}`.toLowerCase().includes(query)));return `<main class="page"><p class="eyebrow">Сохрани перед зачётом</p><h1 class="page-title">Шпаргалка<br>формул.</h1><p class="page-lead">Короткая запись + напоминание о смысле. Добавляй ⭐ то, что хочешь быстро повторить.</p><div class="toolbar"><label class="searchbox"><span>⌕</span><input type="search" id="formula-search" value="${esc(state.search)}" placeholder="Поиск: Гаусс, тороид, ёмкость…" autocomplete="off" aria-label="Поиск формул"></label><button class="icon-btn" data-action="show-saved" title="Сохранённые формулы">★</button></div><div class="filter-row">${['Все',...GROUPS.map(g=>g.name)].map(f=>`<button class="filter-chip ${state.filter===f?'active':''}" data-action="filter" data-filter="${esc(f)}">${esc(f)}</button>`).join('')}</div><div class="section-head"><h2>${state.filter==='Все'?'Все формулы':esc(state.filter)}</h2><span class="pill gray">${list.length} тем</span></div><div class="formula-list">${list.map(t=>`<article class="formula-card"><div class="formula-card-top"><div><span class="formula-no">${String(t.id).padStart(2,'0')} · ${esc(GROUPS.find(g=>t.id>=g.from&&t.id<=g.to).name)}</span><div class="formula-title">${esc(t.t)}</div></div><button class="icon-btn ${progress.saved.includes(t.id)?'saved':''}" data-action="toggle-save" data-id="${t.id}" aria-label="Сохранить формулу">${progress.saved.includes(t.id)?'★':'☆'}</button></div><div class="formula-text">${formulaHtml(t.f)}</div><p class="formula-note">${formulaHtml(t.w)}</p><div class="card-actions"><button class="btn btn-ghost btn-small" data-action="lesson" data-id="${t.id}">Разобрать тему</button><button class="btn btn-ghost btn-small" data-action="copy" data-id="${t.id}">Копировать формулу</button></div></article>`).join('')||`<div class="empty-state"><span class="empty-emoji">🔎</span>Ничего не найдено. Попробуй другое слово или выбери «Все».</div>`}</div><p class="footer-note">В формулах ε₀ — электрическая постоянная, μ₀ — магнитная постоянная, εᵣ и μᵣ — относительные проницаемости среды. Проверь обозначения углов и условия для конкретной геометрии в разборе темы.</p></main>`;}
function progressPage(){const totalDone=progress.done.length,overall=fmtPercent(totalDone,64);return `<main class="page"><p class="eyebrow">Твой маршрут к зачёту</p><h1 class="page-title">Прогресс —<br>это знания.</h1><p class="page-lead">Каждая отмеченная тема остаётся в памяти браузера на этом устройстве.</p><section class="profile-hero"><p class="eyebrow" style="color:#bac5d8">ТВОИ РЕЗУЛЬТАТЫ</p><h2>${overall===100?'Все темы освоены!':overall>=50?'Ты уже на полпути.':'Начало положено.'}</h2><p>Отмечено ${totalDone} из 64 тем. Решено ${progress.answered} тестовых вопросов, верных ответов — ${progress.correct}.</p><div class="progress-bar" style="margin:16px 0 7px;background:#33425b"><span style="width:${overall}%;background:var(--lime)"></span></div><div style="font-size:11px;color:#d2d9e5;font-weight:800">${overall}% программы</div></section><div class="stats-grid"><div class="stat-card"><div class="stat-value">🔥 ${currentStreak()}</div><div class="stat-label">дней подряд</div></div><div class="stat-card"><div class="stat-value">${progress.sessions}</div><div class="stat-label">тренировок</div></div><div class="stat-card"><div class="stat-value">${progress.saved.length}</div><div class="stat-label">в избранном</div></div></div><div class="section-head"><h2>По разделам</h2></div>${GROUPS.map(g=>{const list=TOPICS.filter(t=>t.id>=g.from&&t.id<=g.to),n=list.filter(t=>progress.done.includes(t.id)).length,p=fmtPercent(n,list.length);return `<div class="progress-row"><div class="progress-row-head"><span>${g.icon} ${g.name}</span><span>${n}/${list.length} · ${p}%</span></div><div class="progress-bar"><span style="width:${p}%;background:${p===100?'#5ab981':'#4569ed'}"></span></div></div>`;}).join('')}<div class="section-head"><h2>Повторить сейчас</h2><button class="text-link" data-action="start-weak">Начать →</button></div>${progress.missed.length||progress.saved.length?`<div class="topic-list-simple">${[...new Set([...progress.missed,...progress.saved])].slice(0,8).map(id=>topic(id)).filter(Boolean).map(t=>`<button class="simple-row" data-action="lesson" data-id="${t.id}"><span class="row-no">${t.id}</span><span class="row-title">${esc(t.t)}</span><span class="row-side">›</span></button>`).join('')}</div>`:`<div class="empty-state"><span class="empty-emoji">✨</span>Пока нет сложных тем. Пройди тест — приложение соберёт список того, что стоит повторить.</div>`}<div class="settings-card" style="margin-top:20px"><h3>Управление данными</h3><p>Результаты хранятся локально в Safari и не отправляются на сервер. При очистке данных браузера прогресс может сброситься.</p><button class="btn btn-ghost btn-small" data-action="reset-progress">Сбросить прогресс</button></div><p class="footer-note">Совет на сегодня: лучше несколько раз проговорить формулу и физический смысл, чем просто узнавать её глазами.</p></main>`;}
function lessonHtml(id){const t=topic(id);if(!t)return '';const done=progress.done.includes(t.id),saved=progress.saved.includes(t.id);const group=GROUPS.find(g=>t.id>=g.from&&t.id<=g.to);return `<div class="lesson-sheet" role="dialog" aria-modal="true" aria-label="Тема ${t.id}"><div class="lesson-inner"><div class="sheet-top"><button class="back-btn" data-action="close-lesson">← Назад</button><span class="lesson-num">ТЕМА ${String(t.id).padStart(2,'0')} / 64</span><button class="icon-btn ${saved?'saved':''}" data-action="toggle-save" data-id="${t.id}" aria-label="Сохранить тему">${saved?'★':'☆'}</button></div><p class="eyebrow">${group.icon} ${group.name}</p><h1 class="lesson-title">${esc(t.t)}</h1><div class="lesson-formula"><p class="eyebrow">Главная формула</p><div class="lesson-formula-text">${formulaHtml(t.f)}</div></div><section class="lesson-section"><h3>💡 Что это значит</h3><p>${formulaHtml(t.w)}</p></section><section class="lesson-section"><h3>🗣️ Как ответить на зачёте</h3><div class="oral-box"><p>${formulaHtml(t.say)}</p></div></section><section class="lesson-section"><h3>⚠️ Частая ошибка</h3><p>${esc(t.m)}</p></section><div class="lesson-section"><h3>🔗 Связанные темы</h3><p>Полезно повторить: ${relatedTopics(t.id).map(x=>`${x.id}. ${x.t}`).join('; ')}.</p></div><div class="lesson-footer"><button class="btn ${done?'btn-ghost':'btn-primary'}" data-action="toggle-done" data-id="${t.id}">${done?'✓ Освоено':'Отметить как знаю'}</button><button class="btn btn-dark" data-action="lesson-next" data-id="${t.id}">Следующая →</button></div></div></div>`;}
function relatedTopics(id){const pair={1:[2,3],2:[3,26],3:[26,27],4:[5,6],5:[6,7],6:[5,8],7:[8,54],8:[7,26],9:[10,28],10:[26,27],11:[12,28],12:[11,27],13:[14,28],14:[13,3],15:[16,17],16:[17,18],17:[21,24],18:[17,59],19:[20,28],20:[19,15],21:[23,24],22:[23,25],23:[21,22],24:[25,21],25:[24,34],26:[27,3],27:[26,28],28:[9,11],29:[30,56],30:[29,26],31:[32,38],32:[31,33],33:[34,35],34:[35,31],35:[34,31],36:[37,38],37:[36,41],38:[31,39],39:[40,41],40:[39,41],41:[31,40],42:[43,50],43:[44,45],44:[43,47],45:[43,46],46:[47,48],47:[46,48],48:[50,46],49:[50,57],50:[48,42],51:[52,53],52:[51,43],53:[51,57],54:[51,55],55:[56,29],56:[55,50],57:[58,49],58:[59,61],59:[60,58],60:[59,58],61:[62,59],62:[61,58],63:[64,59],64:[63,57]};return (pair[id]||[]).map(topic).filter(Boolean);}
function flashPage(){const fl=state.flash;if(!fl)return '';if(fl.index>=fl.ids.length)return `<main class="page"><div class="result-wrap"><div class="result-medal">✨</div><h1 class="page-title">Карточки пройдены</h1><p>Отлично! Карточки, отмеченные как «знаю», добавлены в освоенные темы.</p><div class="result-actions"><button class="btn btn-primary btn-block" data-action="start-flash">Ещё карточки</button><button class="btn btn-ghost btn-block" data-action="tab" data-tab="learn">К темам</button></div></div></main>`;const t=topic(fl.ids[fl.index]);return `<main class="page"><div class="section-head"><div><p class="eyebrow">Карточки · активное вспоминание</p><h1 class="page-title" style="font-size:26px;margin:0">Вспомни сам.</h1></div><button class="back-btn" data-action="end-flash">Выйти</button></div><div class="progress-bar"><span style="width:${fmtPercent(fl.index,fl.ids.length)}%"></span></div><div class="flash-wrap"><div class="flash-card"><span class="topic-num">ТЕМА ${String(t.id).padStart(2,'0')} · КАРТОЧКА ${fl.index+1}/${fl.ids.length}</span><h2>${esc(t.t)}</h2>${fl.revealed?`<div class="flash-answer">${formulaHtml(t.f)}</div><p class="flash-explain">${formulaHtml(t.w)}</p><div class="oral-box" style="text-align:left;margin-top:11px"><p style="font-size:12px;line-height:1.55;color:#d8e2f6;margin:0">${formulaHtml(t.say)}</p></div>`:`<p class="flash-prompt">Попробуй воспроизвести формулу по памяти, затем проверь ответ.</p><button class="btn btn-primary" style="margin-top:20px" data-action="reveal-flash">Показать ответ</button>`}</div>${fl.revealed?`<div class="flash-nav"><button class="btn btn-ghost" data-action="flash-hard">↻ Повторить</button><button class="btn btn-dark" data-action="flash-know">Знаю ✓</button></div>`:''}<p class="footer-note">Активное вспоминание помогает лучше запомнить формулы, чем простое перечитывание.</p></div></main>`;}
function render(){const app=$('#app');let content=state.tab==='learn'?learnPage():state.tab==='quiz'?quizPage():state.tab==='cheat'?cheatPage():state.tab==='progress'?progressPage():flashPage();app.innerHTML=topbarHtml()+navHtml()+content+(state.lessonId?lessonHtml(state.lessonId):'');}
function setTab(tab){if(!['learn','quiz','cheat','progress','flash'].includes(tab))return;state.tab=tab;if(tab!=='quiz')state.quiz=null;if(tab!=='flash')state.flash=null;if(tab==='cheat'){state.search='';state.filter='Все';}state.lessonId=null;render();window.scrollTo(0,0);}
function toggleSave(id){id=Number(id);if(progress.saved.includes(id)){progress.saved=progress.saved.filter(x=>x!==id);toast('Убрано из сохранённого');}else{progress.saved.push(id);toast('Сохранено для повтора ★');}persist();render();}
function toggleDone(id){id=Number(id);if(progress.done.includes(id)){progress.done=progress.done.filter(x=>x!==id);toast('Тема возвращена в план');}else{progress.done.push(id);progress.done.sort((a,b)=>a-b);markStudyDay();toast('Тема освоена! +1 к прогрессу');}persist();render();}
function handleAnswer(id){const qz=state.quiz;if(!qz||qz.finished)return;const q=qz.questions[qz.index];if(q.answered)return;id=Number(id);q.selected=id;q.answered=true;progress.answered++;markStudyDay();if(id===q.answerId){qz.correct++;progress.correct++;}else{qz.wrong.push(q.id);if(!progress.missed.includes(q.id))progress.missed.push(q.id);}persist();render();}
function nextQuestion(){const qz=state.quiz;if(!qz)return;if(qz.index<qz.questions.length-1){qz.index++;render();window.scrollTo(0,0);}else{qz.finished=true;progress.sessions++;persist();render();window.scrollTo(0,0);}}
function startFlash(ids){let choices=ids||TOPICS.filter(t=>!progress.done.includes(t.id)).map(t=>t.id);if(!choices.length)choices=TOPICS.map(t=>t.id);state.flash={ids:shuffle(choices).slice(0,Math.min(10,choices.length)),index:0,revealed:false};state.tab='flash';markStudyDay();render();window.scrollTo(0,0);}
function nextFlash(known){const fl=state.flash;if(!fl)return;const id=fl.ids[fl.index];if(known){if(!progress.done.includes(id))progress.done.push(id);progress.missed=progress.missed.filter(x=>x!==id);}else{if(!progress.missed.includes(id))progress.missed.push(id);}persist();fl.index++;fl.revealed=false;render();window.scrollTo(0,0);}
async function copyFormula(id){const t=topic(id);if(!t)return;try{await navigator.clipboard.writeText(`${t.t}\n${t.f.replace(/³ᐟ²/g,'^(3/2)')}`);toast('Формула скопирована');}catch(e){const ta=document.createElement('textarea');ta.value=`${t.t}\n${t.f}`;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(err){}ta.remove();toast(ok?'Формула скопирована':'Не удалось скопировать — выдели формулу вручную');}}
$('#app').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
 switch(a){
 case 'tab':setTab(b.dataset.tab);break;
 case 'lesson':state.lessonId=Number(id);render();window.scrollTo(0,0);break;
 case 'close-lesson':state.lessonId=null;render();break;
 case 'lesson-next':state.lessonId=Number(id)>=64?1:Number(id)+1;render();window.scrollTo(0,0);break;
 case 'toggle-save':toggleSave(id);break;
 case 'toggle-done':toggleDone(id);break;
 case 'start-ticket':beginQuiz('ticket');break;
 case 'start-all':beginQuiz('all');break;
 case 'start-weak':beginQuiz('weak');break;
 case 'answer':handleAnswer(id);break;
 case 'next-question':nextQuestion();break;
 case 'quit-quiz':if(confirm('Выйти из тренировки? Текущий раунд не будет засчитан как завершённый.')){state.quiz=null;render();}break;
 case 'save-current':toggleSave(id);break;
 case 'retry-weak':{const wrong=state.quiz?state.quiz.wrong.slice():[];state.quiz=null;if(wrong.length){state.quiz=buildQuiz([...new Set(wrong)],'weak');state.tab='quiz';render();}else beginQuiz('all');break;}
 case 'filter':state.filter=b.dataset.filter;render();break;
 case 'show-saved':state.filter='Все';state.search='';render();if(!progress.saved.length){toast('Пока нет сохранённых формул');break;}state.filter='Сохранённые';render();break;
 case 'copy':copyFormula(id);break;
 case 'reset-progress':if(confirm('Точно сбросить весь прогресс, избранное и результаты тестов на этом устройстве?')){progress={done:[],saved:[],missed:[],sessions:0,answered:0,correct:0,studyDays:[],lastMode:''};persist();render();toast('Прогресс сброшен');}break;
 case 'start-flash':startFlash();break;
 case 'reveal-flash':if(state.flash){state.flash.revealed=true;render();}break;
 case 'flash-hard':nextFlash(false);break;
 case 'flash-know':nextFlash(true);break;
 case 'end-flash':state.flash=null;state.tab='learn';render();break;
 }
});
$('#app').addEventListener('input',e=>{if(e.target.id==='formula-search'){const pos=e.target.selectionStart;state.search=e.target.value;const oldY=window.scrollY;render();const inp=$('#formula-search');if(inp){inp.focus();inp.setSelectionRange(pos,pos);}window.scrollTo(0,oldY);}});
// Special saved-only filter is applied in a separate handler without adding a fake category.
const originalRender=render;
// Patch cheat filter for saved formulas by filtering the rendered data at source.
const rawCheatPage=cheatPage;
cheatPage=function(){if(state.filter!=='Сохранённые')return rawCheatPage();const q=state.search.trim().toLowerCase();const list=TOPICS.filter(t=>progress.saved.includes(t.id)&&(!q||`${t.id} ${t.t} ${t.f} ${t.w}`.toLowerCase().includes(q)));return `<main class="page"><p class="eyebrow">Избранное для повторения</p><h1 class="page-title">Сложные<br>формулы.</h1><p class="page-lead">Всё, что ты отметил звездой.</p><div class="toolbar"><label class="searchbox"><span>⌕</span><input type="search" id="formula-search" value="${esc(state.search)}" placeholder="Поиск среди сохранённых…" autocomplete="off" aria-label="Поиск сохранённых формул"></label><button class="icon-btn" data-action="filter" data-filter="Все" title="Все формулы">↩</button></div><div class="section-head"><h2>Сохранено</h2><span class="pill gray">${list.length} тем</span></div><div class="formula-list">${list.map(t=>`<article class="formula-card"><div class="formula-card-top"><div><span class="formula-no">ТЕМА ${String(t.id).padStart(2,'0')}</span><div class="formula-title">${esc(t.t)}</div></div><button class="icon-btn saved" data-action="toggle-save" data-id="${t.id}">★</button></div><div class="formula-text">${formulaHtml(t.f)}</div><p class="formula-note">${formulaHtml(t.w)}</p><div class="card-actions"><button class="btn btn-ghost btn-small" data-action="lesson" data-id="${t.id}">Разобрать</button><button class="btn btn-ghost btn-small" data-action="copy" data-id="${t.id}">Копировать</button></div></article>`).join('')||`<div class="empty-state"><span class="empty-emoji">☆</span>Ничего не сохранено. Нажми на звезду у нужной формулы.</div>`}</div></main>`;};
// Reassign is function declaration binding; call render once after all UI wiring.
render();
// Standalone build: assets are embedded in this HTML; no service worker required.

  </script>
